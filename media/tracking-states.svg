<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="270" viewBox="0 0 1050 270" role="img" aria-labelledby="title description">
  <title id="title">T-90M image-tracking indicators</title>
  <desc id="description">Ready or acquiring: four separate side bars with open corners. Locked: four L-shaped corners. Coasting: a closed rectangular outline. These are enlarged diagrams of the in-game indicator shapes.</desc>
  <rect width="1050" height="270" rx="12" fill="#19232e"/>
  <path d="M350 28V242M700 28V242" stroke="#3f4c59"/>
  <g fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="175" y="43" font-size="23" font-weight="600">Ready to lock</text>
    <text x="525" y="43" font-size="23" font-weight="600">Locked</text>
    <text x="875" y="43" font-size="23" font-weight="600">Coasting</text>
  </g>
  <!-- Endpoint ratios match TrackingPresentation: 0.7 for ready bars, 0.6 for locked corners. -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M130.2 77H219.8M130.2 205H219.8M111 96.2V185.8M239 96.2V185.8"/>
    <path d="M486.6 77H461V102.6M563.4 77H589V102.6M461 179.4V205H486.6M563.4 205H589V179.4"/>
    <path d="M811 77H939V205H811Z"/>
  </g>
  <g fill="#ccd6df" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">
    <text x="175" y="243">Lock not yet confirmed</text>
    <text x="525" y="243">Following image detail</text>
    <text x="875" y="243">Predicting through an image gap</text>
  </g>
</svg>
